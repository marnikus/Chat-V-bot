# Development tooling configuration only. The bot itself reads nothing from
# this file — runtime dependencies live in requirements.txt.
#
# It exists because `mutmut` (mutation testing, RULE 16) refuses to start
# without being told what to mutate, and this repository has no `src/` and no
# `pyproject.toml` for it to guess from.
#
#   .venv/bin/mutmut run --max-children 8
#   .venv/bin/mutmut results --all True
#
# On a machine without system OpenGL (`libGL.so.1`), `tests/conftest.py` cannot
# import PySide6's WebEngine bindings and collection fails. Add
# `--noconftest` to the selection below to run anyway — none of the suites
# listed here use conftest fixtures.

[mutmut]
source_paths=
    backend/history_query/query.py
    backend/history_query/request.py
    backend/history_query/rows.py
    backend/history_query/sorting.py
    backend/history_query/sqltext.py
    backend/person_filter.py
    stores/history_models.py
# mutmut copies only the mutated file plus tests/ into its sandbox, but this
# repo's tests/conftest.py imports services.run / app.bootstrap / main, so the
# whole package tree has to come along or collection fails outright.
also_copy=
    actions
    app
    backend
    bridge
    core
    services
    stores
    tools
    main.py
# `--noconftest` is load-bearing here, not a shortcut. mutmut runs pytest
# in-process and reads any non-zero exit as "killed". When tests/conftest.py
# cannot import PySide6 (no system OpenGL, no libdbus — the situation the note
# above describes), collection fails with exit code 4, the forked child dies
# with 1, and EVERY mutant is recorded as killed. Measured 2026-09-13 on a
# machine without PySide6: 159/159 "killed" without this flag, 150 killed / 9
# survived with it — a false 100% mutation score, silently. None of the suites
# selected below uses a conftest fixture, so nothing is given up by skipping it.
pytest_add_cli_args=
    --noconftest
# G5 (2026-09-13) widened this job from ONE file to seven across two packages.
# Before: backend/history_query.py alone, 159 reachable mutants, "99.37%" — a
# true number about 1/190th of the tree. After: 397 reachable, 358 killed,
# 39 survivors, 90.2%, ~65 seconds at ~22 mutations/second. The headline was
# EXPECTED to drop and the first widened run did (78.3%); the tests written to
# close the real gaps took it back up. A score that cannot fall is not a
# measurement.
#
# The gaps it found were real, not cosmetic. Every one is a silent failure:
#   * person_filter._panel_reject had 17 survivors including an inverted
#     `is None` guard — panel criteria could stop being applied at all, and no
#     test would notice, because the suite only ever asserted the PASSING path.
#   * history_models._media_payload could read the wrong key entirely; that is
#     every image in a conversation silently becoming a text line.
#   * dedupe_key's hardcoded occ=0 could become 1 — the archive stops
#     recognising its own stored rows and re-appends whole conversations.
#   * _utf16_units' `<< 8` could become `>> 8` or `<< 9` and every ASCII test
#     still passed, because ASCII's high byte is zero. Only non-ASCII notices.
# The last two are pinned with GOLDEN fingerprint values, because those hashes
# are on disk in every user's archive: distinguishing tests prove the hash
# separates things, only a fixed constant proves it has not shifted wholesale.
#
# The 39 remaining survivors were each read and are equivalent, in three
# families: (1) log/verdict MESSAGE text, which no behaviour depends on;
# (2) `bool(None)` vs `bool(False)` in sort keys, which are the same value;
# (3) mutmut's "XX...XX" string markers inside literals that are only ever
# compared to themselves. Asserting on any of them would test the mutation
# tool, not the code.
#
# Only the suites that actually exercise the sort path. Keeping this narrow is
# what makes a full mutation run take ~1 minute instead of hours; mutants that
# no test can reach are reported as "no tests" and excluded from the score, so
# narrowing the suite cannot inflate the result.
#
# Narrowness does have a cost, and step F6 measured it: four of the nine
# survivors reported in reports/CODE_QUALITY_METRICS_2026-09-12.md §3 are killed
# by tests/test_history_query_edges.py, which this job does not select
# (`_like_escape` 13/14 and `_clamp` 4/9, verified one mutant at a time). So a
# survivor here means "no SELECTED suite kills it", not "no suite kills it".
# Adding that file was measured and rejected: it executes all 29 functions of
# the module, which takes the reachable set from 159 mutants to 910 of 1,141,
# and this job's ~25 seconds become something else (the reachable count is
# measured; the runtime was not run, so it is not quoted).
# tests/test_history_query_gaps.py pins those four again at the level this job
# measures, plus the four `list_persons` mutants that no suite anywhere could
# reach over a real database.
pytest_add_cli_args_test_selection=
    tests/test_person_item.py
    tests/test_person_page_request.py
    tests/test_userdb_sort_query.py
    tests/test_history_query_gaps.py
    tests/unit/backend/test_person_filter_contract.py
    tests/test_history_models_edges.py
