# Development tooling configuration only. The bot itself reads nothing from
# this file — runtime dependencies live in requirements.txt.
#
# It exists because `mutmut` (mutation testing, RULE 16) refuses to start
# without being told what to mutate, and this repository has no `src/` and no
# `pyproject.toml` for it to guess from.
#
#   .venv/bin/mutmut run --max-children 8
#   .venv/bin/mutmut results --all True
#
# On a machine without system OpenGL (`libGL.so.1`), `tests/conftest.py` cannot
# import PySide6's WebEngine bindings and collection fails. Add
# `--noconftest` to the selection below to run anyway — none of the suites
# listed here use conftest fixtures.

[mutmut]
source_paths=backend/history_query.py
# mutmut copies only the mutated file plus tests/ into its sandbox, but this
# repo's tests/conftest.py imports services.run / app.bootstrap / main, so the
# whole package tree has to come along or collection fails outright.
also_copy=
    actions
    app
    backend
    bridge
    core
    services
    stores
    tools
    main.py
# Only the suites that actually exercise the sort path. Keeping this narrow is
# what makes a full mutation run take ~1 minute instead of hours; mutants that
# no test can reach are reported as "no tests" and excluded from the score, so
# narrowing the suite cannot inflate the result.
pytest_add_cli_args_test_selection=
    tests/test_person_item.py
    tests/test_person_page_request.py
    tests/test_userdb_sort_query.py
