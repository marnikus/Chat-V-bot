# RULE 16: install with `pip install -r requirements-dev.txt; pre-commit install`.
# The general hook reads index blobs (partial staging safe). Its isolated Python
# environment installs the same analysis pins as requirements-dev.txt; missing
# tools fail rather than silently skipping. Full suites/clones belong in CI.
# Historical feature invariants remain an additional, narrower check.
repos:
  - repo: local
    hooks:
      - id: changed-code-gate
        name: RULE 16 staged changed-code gate
        entry: python tools/metrics/changed_code_gate.py --staged
        language: python
        additional_dependencies:
          - radon==6.0.1
          - cognitive-complexity==1.3.0
          - vulture==2.16
          - pylint==4.0.8
        always_run: true
        pass_filenames: false
      - id: rule16-gate
        name: RULE 16 historical feature invariants
        entry: python3 tools/metrics/rule16_gate.py
        language: system
        always_run: true
        pass_filenames: false
