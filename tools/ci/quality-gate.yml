# INACTIVE TEMPLATE, NOT A HOSTED CHECK.
# A previous push was rejected because the connected GitHub App lacked workflow
# permission. An authorized maintainer must copy this to .github/workflows/.
# Hosted enforcement/branch protection remains pending; --no-verify can bypass
# local hooks. No claim is made here that the App permission has since changed.
name: quality gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BEFORE_SHA: ${{ github.event.before }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  CURRENT_BRANCH: ${{ github.ref_name }}

jobs:
  rule16-gate:
    name: RULE 16 structure, unused code and clones
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install measuring tools
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve the comparison base
        id: base
        run: python -m tools.metrics.changed_code.ci >> "$GITHUB_OUTPUT"
      - name: General changed-code gate
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        run: python tools/metrics/changed_code_gate.py --base "$BASE_SHA" --with-clones
      - name: Historical feature invariants
        run: python tools/metrics/rule16_gate.py --with-clones
      - name: Gate behavior tests (no Qt imports)
        run: >-
          python -m pytest --noconftest -q tests/test_rule16_new_code.py
          tests/test_changed_code_gate.py tests/test_changed_code_policy.py
          tests/test_changed_code_inspections.py

  test-suite:
    name: full tests and baseline-ratcheted branch coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries PySide6 needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve the comparison base
        id: base
        run: python -m tools.metrics.changed_code.ci >> "$GITHUB_OUTPUT"
      - name: Run the actual suite and verify fresh coverage
        env:
          QT_QPA_PLATFORM: offscreen
          BASE_SHA: ${{ steps.base.outputs.base }}
        # Excludes ONLY the real-WebEngine GL case, not its whole test module.
        # This invokes pytest itself and rejects source changes during tests.
        run: python tools/metrics/changed_code_gate.py --base "$BASE_SHA" --run-tests
      - name: JavaScript DOM harnesses
        run: |
          for test in tests/test_*.js; do node "$test"; done
