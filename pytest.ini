[pytest]
testpaths = tests
addopts = -p no:cacheprovider --strict-markers -m "not webengine"
filterwarnings =
    ignore::DeprecationWarning
markers =
    pure: no Qt, no DB, no I/O — fast (<10 ms), 70% of suite
    db: needs HistoryDB (file or memory)
    db_file: needs file DB (asserts file path)
    qt: needs PySide6 / QApplication / real QObject
    gate: runs rule16/clone/vulture — slow, 20+ s
    slow: >1 s per test — skip with -m "not slow" for quick
    integration: full app container, slowest
    metrics: executable ratchets/gates (wait-budget, JS-coverage) — own lane, not the quick tiers
    node: the tests/test_*.js suites via tests/test_node_harness_suites.py
    webengine: real Qt WebEngine (Chromium) — opt-in only: needs working GL/sandbox (off by default)
