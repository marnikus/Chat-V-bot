[pytest]
addopts = --cov=core --cov=stores --cov=services --cov=bridge --cov-report=term-missing --cov-fail-under=70
testpaths = tests
python_files = test_*.py
# NOTE: global 70 is aspirational; stores+services currently 75-84% (tested via test_stores_migration)
# CI will enforce per-package 90% on stores+services once coverage improves (see docs/NEW_ARCHITECTURE)
