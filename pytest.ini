[pytest]
testpaths = tests
# webengine is excluded by default because it needs a real GPU/GL context;
# run it locally with `pytest -m webengine` (a CLI -m overrides this one).
# `-n auto` (parallel lane) stays opt-in here: keep serial one command away
# for debugging. Lanes (plan: docs/archive/2026-09-15-test-time-reduction/):
#   parallel:  pytest -n auto --dist loadfile -q
#   fast lane: pytest -n 4 -m "not slow and not e2e and not metrics"
addopts = -p no:cacheprovider --strict-markers -m "not webengine"
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: per-module contracts living in tests/unit/ (auto-marked by path)
    integration: cross-module contracts living in tests/integration/ (auto-marked by path)
    e2e: *_e2e.py full end-to-end flows with a real DB lifecycle (auto-marked)
    slow: real waits/timeouts; policy — ≤ 50 ms real sleep per test, else this mark + a "# wait-budget:" reason (ratchet: tests/test_wait_budget.py)
    metrics: executable gates (RULE 16, wait-budget, JS-coverage ratchets) — own lane, not the fast lane (auto-marked)
    node: the 29 tests/test_*.js suites via tests/test_node_harness_suites.py (marked in-file)
    webengine: needs a real GPU/GL Qt WebEngine context (tests/test_sash_webengine.py) — excluded by default addopts
